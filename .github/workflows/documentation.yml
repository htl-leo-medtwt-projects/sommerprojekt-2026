name: Deploy Docs to GitHub Pages

on:
    workflow_dispatch:
    push:
        branches: ['**']
        paths: ['documentation/**']

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  sparse-checkout: |
                      documentation
                      project
                      build-docs.sh
                  sparse-checkout-cone-mode: false

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Get pandoc cache key
              id: pandoc-key
              run: |
                  PANDOC_VERSION="3.1.11"  # Fixed version for stability
                  echo "version=$PANDOC_VERSION" >> "$GITHUB_OUTPUT"
                  echo "key=pandoc-$PANDOC_VERSION" >> "$GITHUB_OUTPUT"

            - name: Cache pandoc
              id: cache-pandoc
              uses: actions/cache@v4
              with:
                  path: /usr/bin/pandoc
                  key: ${{ steps.pandoc-key.outputs.key }}

            - name: Install pandoc
              if: steps.cache-pandoc.outputs.cache-hit != 'true'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pandoc

            - name: Build docs
              run: ./build-docs.sh

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: 'dist'

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
