name: Code Quality

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    quality-check:
        name: Code Quality Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Cache global npm packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.npm
                      node_modules
                  key: ${{ runner.os }}-node-global-${{ hashFiles('.github/workflows/code-quality.yml', 'eslint.config.js') }}
                  restore-keys: |
                      ${{ runner.os }}-node-global-

            - name: Install ESLint and Prettier
              run: |
                  npm install -g eslint prettier
                  npm install eslint-config-prettier

            - name: Run ESLint
              id: eslint
              run: |
                  echo "## ESLint Results" >> $GITHUB_STEP_SUMMARY
                  if npx eslint . --ext .js; then
                    echo "✅ No ESLint violations" >> $GITHUB_STEP_SUMMARY
                    echo "eslint_status=success" >> $GITHUB_OUTPUT
                  else
                    echo "❌ ESLint violations found" >> $GITHUB_STEP_SUMMARY
                    echo "eslint_status=failure" >> $GITHUB_OUTPUT
                    exit 1
                  fi

            - name: Format with Prettier
              id: prettier
              run: |
                  echo "## Prettier Formatting" >> $GITHUB_STEP_SUMMARY

                  # Get list of files to format
                  FILES_TO_FORMAT=$(npx prettier --list-different "**/*.js" "**/*.html" "**/*.css" "**/*.json" --ignore-unknown --config prettier.config.js 2>/dev/null || true)

                  if [ -z "$FILES_TO_FORMAT" ]; then
                    echo "✅ All files already formatted" >> $GITHUB_STEP_SUMMARY
                    echo "prettier_status=success" >> $GITHUB_OUTPUT
                  else
                    echo "📝 Formatting files:" >> $GITHUB_STEP_SUMMARY
                    echo "$FILES_TO_FORMAT" | while read file; do
                      echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
                    done
                    
                    # Actually format the files using config
                    npx prettier --write "**/*.js" "**/*.html" "**/*.css" "**/*.json" --ignore-unknown --config prettier.config.js
                    
                    # Commit changes if in a PR or on main branch
                    if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_REF" == "refs/heads/main" ]]; then
                      git config --local user.email "action@github.com"
                      git config --local user.name "GitHub Action"
                      git add -A
                      if git diff --staged --quiet; then
                        echo "No changes to commit" >> $GITHUB_STEP_SUMMARY
                      else
                        git commit -m "🎨 Format code with Prettier"
                        git push
                        echo "📤 Changes committed and pushed" >> $GITHUB_STEP_SUMMARY
                      fi
                    fi
                    
                    echo "prettier_status=formatted" >> $GITHUB_OUTPUT
                  fi
