name: Code Quality

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    quality-check:
        name: Code Quality Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Cache global npm packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.npm
                      node_modules
                  key: ${{ runner.os }}-node-eslint-${{ hashFiles('.github/workflows/code-quality.yml', 'eslint.config.js') }}
                  restore-keys: |
                      ${{ runner.os }}-node-eslint-

            - name: Install ESLint
              run: |
                  npm install -g eslint
                  npm install eslint-config-prettier eslint-formatter-compact

            - name: Run ESLint
              id: eslint
              run: |
                  echo "## ESLint Results" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  # Run ESLint and check exit code
                  if npx eslint project/ --ext .js --format=compact > eslint-output.txt 2>&1; then
                    echo "✅ No ESLint violations" >> $GITHUB_STEP_SUMMARY
                    echo "eslint_status=success" >> $GITHUB_OUTPUT
                  else
                    echo "❌ ESLint violations found:" >> $GITHUB_STEP_SUMMARY
                    echo "" >> $GITHUB_STEP_SUMMARY
                    echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                    cat eslint-output.txt >> $GITHUB_STEP_SUMMARY
                    echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                    echo "eslint_status=failure" >> $GITHUB_OUTPUT
                  fi
