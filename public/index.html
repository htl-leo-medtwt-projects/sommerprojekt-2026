<!doctype html>

<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dungeoner</title>

        <!-- p5.js v2.2.1 -->
        <script src="https://cdn.jsdelivr.net/npm/p5@2.2.1/lib/p5.min.js"></script>

        <script type="module" src="index.js" defer></script>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <!-- Room Dialog -->
        <dialog id="roomDialog">
            <h2>Game Room</h2>
            <button id="createRoomBtn">Create Room</button>
            <div id="joinSection">
                <input
                    type="text"
                    id="roomCodeInput"
                    placeholder="Enter 6-digit code"
                    maxlength="6"
                />
                <button id="submitJoinBtn">Join</button>
            </div>
            <button id="closeDialogBtn" style="margin-top: 10px">Close</button>
        </dialog>
    </body>
</html>
